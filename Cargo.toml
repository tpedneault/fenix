[workspace]
resolver = "2"
members = ["crates/fenix-buffers", "crates/fenix-completion", "crates/fenix-config", "crates/fenix-core", "crates/fenix-docker", "crates/fenix-explorer", "crates/fenix-format", "crates/fenix-git", "crates/fenix-gui", "crates/fenix-jira", "crates/fenix-keymap", "crates/fenix-lsp", "crates/fenix-mib", "crates/fenix-pdf", "crates/fenix-picker", "crates/fenix-project", "crates/fenix-rpc", "crates/fenix-syntax", "crates/fenix-table", "crates/fenix-tasks", "crates/fenix-terminal", "crates/fenix-vim", "crates/fenix-vnc", "crates/fenix-window"]

[workspace.package]
version = "0.0.1"
edition = "2021"

# `fenix-vnc` needs to know where one server `FramebufferUpdate` message
# ends, which the published crate decodes but never surfaces -- without it
# a client can't present whole frames or pace its update requests. The
# vendored copy adds that one event; see `vendor/vnc-rs/PATCH.md`.
[patch.crates-io]
vnc-rs = { path = "vendor/vnc-rs" }

[profile.release]
lto = true
codegen-units = 1
