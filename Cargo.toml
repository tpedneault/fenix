[workspace]
resolver = "2"
members = ["crates/fenix-acp", "crates/fenix-brand", "crates/fenix-snippets", "crates/fenix-ssh", "crates/fenix-storage", "crates/fenix-buffers", "crates/fenix-completion", "crates/fenix-config", "crates/fenix-control", "crates/fenix-core", "crates/fenix-dap", "crates/fenix-diff", "crates/fenix-explorer", "crates/fenix-extension-api", "crates/fenix-extensions", "crates/fenix-format", "crates/fenix-fs", "crates/fenix-git", "crates/fenix-gui", "crates/fenix-keymap", "crates/fenix-lsp", "crates/fenix-model", "crates/fenix-pdf", "crates/fenix-pdfium", "crates/fenix-picker", "crates/fenix-project", "crates/fenix-recovery", "crates/fenix-remote", "crates/fenix-rpc", "crates/fenix-syntax", "crates/fenix-table", "crates/fenix-tasks", "crates/fenix-terminal", "crates/fenix-vim", "crates/fenix-wasm", "crates/fenix-window"]

[workspace.package]
version = "1.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpedneault/fenix"
authors = ["Thomas Pedneault <thomas@pedneault.dev>"]
# The crates are Fenix's own building blocks, not libraries on crates.io.
publish = false

[profile.release]
lto = true
codegen-units = 1

# Dependencies are rarely stepped through: line tables keep their
# backtraces readable, and drop most of the debug info a link has to
# write. Fenix's own crates keep full debug info.
[profile.dev.package."*"]
debug = "line-tables-only"

# A release build in a few minutes rather than many, for trying a change
# at full speed: `cargo build --profile release-fast`. Releases are built
# with `release`.
[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true

# Extensions are compiled to machine code when they're loaded, and an
# unoptimised compiler takes seconds over each: the extension tests run
# about five times faster with these. They cost minutes, once.
[profile.dev.package.cranelift-codegen]
opt-level = 2
[profile.dev.package.cranelift-frontend]
opt-level = 2
[profile.dev.package.cranelift-entity]
opt-level = 2
[profile.dev.package.cranelift-bforest]
opt-level = 2
[profile.dev.package.cranelift-assembler-x64]
opt-level = 2
[profile.dev.package.regalloc2]
opt-level = 2
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 2
[profile.dev.package.wasmtime-environ]
opt-level = 2
[profile.dev.package.wasmparser]
opt-level = 2
