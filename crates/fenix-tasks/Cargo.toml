[package]
name = "fenix-tasks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# `fake-test-runner`, a made-up test runner, and what the test explorer's
# tests drive it with (`fake_runner`): for tests only.
fake-runner = []

[[bin]]
name = "fake-test-runner"
required-features = ["fake-runner"]

[dependencies]
process-wrap = { version = "10", features = ["std"] }
fenix-rpc = { path = "../fenix-rpc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading"] }
windows-sys = { version = "0.61", features = ["Win32_System_Pipes", "Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "fake_runner"
required-features = ["fake-runner"]
