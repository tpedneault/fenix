"""

[[step]]
say = "Record a macro: on the first - item, qa, then A, type a space and done, Esc, j, and q. 3@a then does the other three."
hint = "qa starts recording (the modeline says so) and q stops; the j leaves the cursor on the next item, ready for the next go."
text = """
