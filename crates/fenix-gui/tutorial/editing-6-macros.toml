id = "editing.macros"
track = "Editing"
order = 6
title = "Registers and macros"
about = "Named registers to keep text in, a macro to do the same keys again, and the dot."
text = """
"a before y, d or p uses register a, not the one every yank and delete
shares. qa records the keys you press into register a and q stops; @a
plays them back, and 3@a three times. A dot repeats the last change.

Copy me with "ayy.
Paste it under here with "ap:
- item
- item
- item
- item
TODO TODO TODO
"""

[[step]]
say = 'On line 5, "ayy yanks the line into register a; then on line 6, "ap puts it under.'
hint = 'The double quote, a, then yy -- and the same with p.'
text = """
