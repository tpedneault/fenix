id = "fenix.leader"
track = "Fenix"
order = 1
title = "The leader and which-key"
about = "{leader} starts every Fenix command that isn't the editor's own, and a menu shows what can follow."
text = """
{leader} is Fenix's leader (with Vim keys, Space in Normal mode). It
starts a key sequence, and a menu (which-key) shows what can come next:
groups like w for windows and f for files. Backspace goes back up a
level; Esc closes it.

SPC : runs any command by its name, SPC h b lists the keys bound where
you are, and SPC h k says what a key does.
"""

[[step]]
say = "Press {leader} and wait a moment: the menu shows the groups."
hint = "{leader} -- with Vim keys, in Normal mode: Esc first if the modeline says INSERT."
leader = true

[[step]]
say = "Esc closes the menu."
hint = "Esc, while the menu is open."
leader = false

[[step]]
say = "SPC : opens the command palette, every command by name."
hint = "{leader}, then the colon."
picker = "commands"

[[step]]
say = "Esc closes it -- or type part of a command's name and Enter runs it."
hint = "Esc."
picker = "none"

[[step]]
say = "SPC h b lists the keys bound here, and what each runs."
hint = "{leader}, h (help), b."
picker = "bindings"

[[step]]
say = "Esc."
hint = "Esc closes the list."
picker = "none"
