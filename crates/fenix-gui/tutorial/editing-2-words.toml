[[step]]
say = "J joins the next line onto this one: make Join this line and with this one. a single line."
hint = "On Join this line, J."
text = """
w jumps to the start of the next word, b back to the last, e to a word's end.
0 goes to the start of the line, $ to its end.

Delete the doubled word: this is a sentence.
Keep this part.
