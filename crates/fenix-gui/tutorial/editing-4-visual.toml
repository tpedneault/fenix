id = "editing.visual"
track = "Editing"
order = 4
title = "Visual mode"
about = "Select first, then act: characters, lines and blocks."
text = """
v starts selecting characters, V whole lines, Ctrl-v a block. Move to grow
the selection, then act on it: d deletes it, c changes it, y yanks it,
U makes it upper case, u lower, ~ swaps.

make this line loud
Delete these two lines
with V, j and d.
one
two
three
The end.
"""

[[step]]
say = "V selects the whole line, U makes it upper case: make line 5 loud."
hint = "On line 5, V, then U."
