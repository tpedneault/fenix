# Fenix's own keys, as data: the leader map (`SPC ...`) and core's
# `SPC m` entries. Features add theirs from their specs; your own
# `keybindings.toml` will go over these (Phase 1). Keys are written
# the way the which-key menu writes them: `SPC f s`, `SPC Tab n`.
#
# An entry with `command` binds its keys; with `group`, it names a
# group of keys; with only `section`, it files a key under a section
# of its group's which-key menu (`WHICH_KEY_SECTIONS`).

[[leader]]
keys = "SPC"
group = "leader"

[[leader]]
keys = "SPC i"
group = "insert"

[[leader]]
keys = "SPC i s"
label = "snippet"
command = "insert.snippet"

[[leader]]
