label = "paper / theme colours"
command = "pdf.colors"

[[local.reader]]
keys = "y"
label = "copy a link to this page (yp)"
command = "pdf.copy_link"

[[local.reader]]
keys = "/"
label = "search (/)"
command = "pdf.search"

[[local.reader]]
keys = "d"
label = "documents"
command = "pdf.documents"

# `SPC m` in Markdown and the reading view.

[[local.markdown]]
keys = "p"
label = "reading view beside"
command = "notebook.preview"

[[local.markdown]]
keys = "r"
label = "read here (swap)"
command = "notebook.read"
