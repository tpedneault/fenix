[package]
name = "fenix-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "fenix"
path = "src/main.rs"

# The built-in extensions, each one Cargo feature: all of them by
# default, the core alone with `--no-default-features` (CI builds both, so
# the core can't come to depend on an extension).
[features]
default = ["docker", "tcl", "diagrams", "embedded", "mission", "notebook"]
docker = ["dep:fenix-docker"]
diagrams = ["notebook", "dep:fenix-diagram"]
tcl = []
mission = ["dep:fenix-ccsds", "dep:fenix-mib"]
embedded = ["dep:fenix-embedded"]
notebook = []

[dependencies]
anyhow = "1.0.104"
arboard = "3"
bytemuck = { version = "1.25.2", features = ["derive"] }
chrono = "0.4"
dirs = "6"
fenix-agenda = { path = "../fenix-agenda" }
fenix-buffers = { path = "../fenix-buffers" }
fenix-ccsds = { path = "../fenix-ccsds", optional = true }
fenix-completion = { path = "../fenix-completion" }
fenix-config = { path = "../fenix-config" }
fenix-control = { path = "../fenix-control" }
fenix-core = { path = "../fenix-core" }
fenix-dap = { path = "../fenix-dap" }
fenix-docker = { path = "../fenix-docker", optional = true }
fenix-explorer = { path = "../fenix-explorer" }
fenix-format = { path = "../fenix-format" }
fenix-fs = { path = "../fenix-fs" }
fenix-diff = { path = "../fenix-diff" }
fenix-forge = { path = "../fenix-forge" }
fenix-git = { path = "../fenix-git" }
fenix-gitlab = { path = "../fenix-gitlab" }
fenix-github = { path = "../fenix-github" }
fenix-jira = { path = "../fenix-jira" }
fenix-keymap = { path = "../fenix-keymap" }
fenix-lsp = { path = "../fenix-lsp" }
fenix-mib = { path = "../fenix-mib", optional = true }
fenix-diagram = { path = "../fenix-diagram", optional = true }
fenix-notebook = { path = "../fenix-notebook" }
fenix-pdf = { path = "../fenix-pdf" }
fenix-picker = { path = "../fenix-picker" }
fenix-project = { path = "../fenix-project" }
fenix-recovery = { path = "../fenix-recovery" }
fenix-syntax = { path = "../fenix-syntax" }
fenix-brand = { path = "../fenix-brand" }
fenix-snippets = { path = "../fenix-snippets" }
fenix-table = { path = "../fenix-table" }
fenix-tasks = { path = "../fenix-tasks" }
fenix-embedded = { path = "../fenix-embedded", optional = true }
fenix-terminal = { path = "../fenix-terminal" }
fenix-vim = { path = "../fenix-vim" }
fenix-vnc = { path = "../fenix-vnc" }
fenix-window = { path = "../fenix-window" }
glyphon = "0.12.0"
image = { version = "0.25", default-features = false, features = ["ico", "png", "jpeg", "gif", "webp", "bmp"] }
lsp-types = "0.97"
pollster = "1.0.1"
pulldown-cmark = { version = "0.13", default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
fenix-storage = { path = "../fenix-storage" }
vt100 = "0.16"
wgpu = "30.0.1"
winit = "0.30.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"
fenix-brand = { path = "../fenix-brand", features = ["ico"] }

[dev-dependencies]
tempfile = "3"
