# Catppuccin Latte, the light flavour.
#
# A light theme: accents are kept at 3:1 on its surfaces, darkened from
# the palette's own (in lightness only) where they fall short; body text,
# identifiers, comments and line numbers at 4.5:1.
name = "Catppuccin Latte"
tabs = "underline"

[surfaces]
bg = "#eff1f5"
sidebar_bg = "#e6e9ef"
bg_modeline = "#e6e9ef"
divider = "#acb0be"
caret = "#dc8a78"
hl_line = "#dce0e8"
selection = { color = "#7c7f93", alpha = 0.25 }
bracket_match = { color = "#fe640b", alpha = 0.15 }
search_match = { color = "#04a5e5", alpha = 0.18 }

[text]
fg = "#4c4f69"
fg_modeline = "#4c4f69"
caret_text = "#984c3d"
gutter_fg = "#5e6176"

[modes]
normal = "#1961f0"
insert = "#157e00"
visual = "#8839ef"
replace = "#d20f39"
command = "#cb3100"
explorer = "#00778d"
picker = "#b04095"
text_dark = "#eff1f5"

[syntax]
keyword = "#8839ef"
string = "#157e00"
comment = "#5e6174"
function = "#1961f0"
type = "#a55800"
number = "#cc3300"
constant = "#cc3300"
variable = "#4c4f69"
operator = "#0072af"
punctuation = "#0072af"
attribute = "#007980"

[explorer]
folder = "#1961f0"
file = "#4c4f69"

[git]
modified = "#a55800"
staged = "#157e00"
untracked = "#007980"
ignored = "#686b7e"
conflicted = "#d20f39"
