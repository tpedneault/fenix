# Tokyo Night's Storm variant, enkia's palette. (Orbit Dark is the Night one.)
name = "Tokyo Night Storm"
tabs = "underline"

[surfaces]
bg = "#24283b"
sidebar_bg = "#1f2335"
bg_modeline = "#1f2335"
divider = "#3b4261"
caret = "#c0caf5"
hl_line = "#292e42"
selection = { color = "#7aa2f7", alpha = 0.15 }
bracket_match = { color = "#2ac3de", alpha = 0.12 }
search_match = { color = "#e0af68", alpha = 0.15 }

[text]
fg = "#c0caf5"
fg_modeline = "#c0caf5"
caret_text = "#c0caf5"
gutter_fg = "#9096b6"

[modes]
normal = "#7aa2f7"
insert = "#9ece6a"
visual = "#bb9af7"
replace = "#ff9e64"
command = "#e0af68"
explorer = "#7dcfff"
picker = "#bb9af7"
text_dark = "#1f2335"

[syntax]
keyword = "#bb9af7"
string = "#9ece6a"
comment = "#9096b6"
function = "#7aa2f7"
type = "#2ac3de"
number = "#ff9e64"
constant = "#ff9e64"
variable = "#c0caf5"
operator = "#89ddff"
punctuation = "#89ddff"
attribute = "#e0af68"

[explorer]
folder = "#7aa2f7"
file = "#c0caf5"

[git]
modified = "#e0af68"
staged = "#9ece6a"
untracked = "#7aa2f7"
ignored = "#9096b6"
conflicted = "#f7768e"
