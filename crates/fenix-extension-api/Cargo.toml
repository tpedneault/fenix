[package]
name = "fenix-extension-api"
description = "Writing a Fenix extension in Rust: the extension API (wit/world.wit), and what makes it easy to use."
version = "1.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# The time where you are (`clock`).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
wit-bindgen = "0.63"
# Being a language server (`lsp`): the same types Fenix speaks.
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
