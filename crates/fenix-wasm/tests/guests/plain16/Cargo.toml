[package]
name = "plain16"
version = "0.1.0"
edition = "2021"
publish = false
description = "fenix-wasm's test extension built on the 1.6 API crate that uses nothing 1.6 added (its manifest would say api = \"1.5\"): it must still start on Fenix 1.5. tests/guests/build.ps1 builds it to plain16.wasm."

[lib]
crate-type = ["cdylib"]

[dependencies]
fenix-extension-api = { path = "../../../../fenix-extension-api" }

[profile.release]
opt-level = "s"
lto = true
strip = true

# Built on its own, for wasm32-wasip2, not with Fenix.
[workspace]
