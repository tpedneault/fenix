[package]
name = "callers"
version = "0.1.0"
edition = "2021"
publish = false
description = "fenix-wasm's test extension for service callers, on the 1.6 API crate: it answers who called it (`called_by`), calls on to another, and counts what its gated service ran. tests/guests/build.ps1 builds it to callers.wasm."

[lib]
crate-type = ["cdylib"]

[dependencies]
fenix-extension-api = { path = "../../../../fenix-extension-api" }

[profile.release]
opt-level = "s"
lto = true
strip = true

# Built on its own, for wasm32-wasip2, not with Fenix.
[workspace]
