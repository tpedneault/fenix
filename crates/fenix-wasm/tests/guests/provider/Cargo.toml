[package]
name = "provider"
version = "0.1.0"
edition = "2021"
publish = false
description = "fenix-wasm's test extension for API 1.6: a test provider of a made-up runner, every export and the import. tests/guests/build.ps1 builds it to provider.wasm."

[lib]
crate-type = ["cdylib"]

[dependencies]
fenix-extension-api = { path = "../../../../fenix-extension-api" }

[profile.release]
opt-level = "s"
lto = true
strip = true

# Built on its own, for wasm32-wasip2, not with Fenix.
[workspace]
