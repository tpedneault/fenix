[package]
name = "hello"
version = "0.1.0"
edition = "2021"
publish = false
description = "fenix-wasm's test extension; tests/guests/build.ps1 builds it to hello.wasm."

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63"

[profile.release]
opt-level = "s"
lto = true
strip = true

