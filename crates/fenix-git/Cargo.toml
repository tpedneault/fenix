[package]
name = "fenix-git"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# One runtime dependency, which itself has none: `fenix-vfs`, so that a
# remote project's repository has its `git` run on its machine and its
# `.git` read there. Otherwise this crate shells out to `git` and parses
# text, nothing more.
[dependencies]
fenix-vfs = { path = "../fenix-vfs" }

# Test-only. `apply_patch` takes
# a patch as a plain string precisely so building one (which is
# `fenix-diff`'s job) stays the caller's concern; the tests need
# `fenix-diff` only to produce realistic patches to feed it.
[dev-dependencies]
fenix-diff = { path = "../fenix-diff" }
# A remote machine in the tests: the real helper, in this process.
fenix-ssh = { path = "../fenix-ssh" }
