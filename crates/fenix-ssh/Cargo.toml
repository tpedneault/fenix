[package]
name = "fenix-ssh"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# Fenix's side of a remote project: one `ssh` process per host, the
# helper put in place and started at its far end, and requests and
# programs run over that one connection.
[dependencies]
fenix-remote = { path = "../fenix-remote" }
fenix-vfs = { path = "../fenix-vfs" }
# The tokens the askpass hook and the stand-in present: from the system.
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
