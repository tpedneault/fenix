[package]
name = "fenix-remote"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# The helper Fenix runs on the far end of an SSH connection, and the
# protocol the two speak. Kept to a few small dependencies: the helper is
# built static for Linux and copied to machines Fenix knows nothing of.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Search, as ripgrep does it, with ripgrep's own libraries: the machine
# needn't have `rg`.
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
ignore = "0.4.34"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
