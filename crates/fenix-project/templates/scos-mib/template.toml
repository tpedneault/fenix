[template]
name = "SCOS-2000 MIB"
kind = "mib"
group = "Mission"
open = ["vdf.dat"]
description = "An ICD 7.2 MIB database and nothing else: its tab-separated .dat tables, registered for SPC m lookups."

[[ask]]
key = "label"
label = "Label"
default = "{{name}}"
hint = "how SPC m t / SPC m k name this database"

[[ask]]
key = "icd"
label = "ICD"
choices = ["7.2"]
default = "7.2"
hint = "the Database Import ICD version Fenix reads"

[[ask]]
key = "tables"
label = "Tables"
many = ["telecommands", "telemetry", "calibrations", "monitoring", "sequences"]
default = ["telecommands", "telemetry", "calibrations"]

[[ask]]
key = "register"
label = "Register"
default = true
hint = "add it as a [mib] root in config.ini"

[[file]]
path = "vdf.dat"
content = "{{label}}\t{{name}}\n"

[[hook]]
kind = "mib-root"
path = "."
label = "{{label}}"
when = "register"

