[template]
name = "SCOS-2000 MIB workspace"
kind = "mib"
group = "Mission"
description = "An ICD 7.2 MIB database as tab-separated .dat tables under mib/, a Tcl procedures folder, and the database registered for SPC m lookups."

[[ask]]
key = "label"
label = "Label"
default = "{{name}}"
hint = "how SPC m t / SPC m k name this database"

[[ask]]
key = "icd"
label = "ICD"
choices = ["7.2"]
default = "7.2"
hint = "the Database Import ICD version Fenix reads"

[[ask]]
key = "tables"
label = "Tables"
many = ["telecommands", "telemetry", "calibrations", "monitoring", "sequences"]
default = ["telecommands", "telemetry", "calibrations"]

[[ask]]
key = "register"
label = "Register"
default = true
hint = "add mib/ as a [mib] root in config.ini"

[[ask]]
key = "procedures"
label = "Procedures"
default = true
hint = "a procedures/ folder for Tcl telecommand scripts"

[[file]]
path = "mib/vdf.dat"
content = "{{label}}\t{{name}}\n"

[[file]]
path = ".fenix/project.ini"
content = "[project]\nkind = mib\n"

[[file]]
path = "procedures/{{name_snake}}.tcl"
from = "procedures/main.tcl"
when = "procedures"

[[hook]]
kind = "mib-root"
path = "mib"
label = "{{label}}"
when = "register"

[[file]]
path = "mib/ccf.dat"
content = ""
when = "tables == telecommands"

