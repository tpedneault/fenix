[template]
name = "Rust · cargo"
kind = "rust"
group = "Systems"
description = "A cargo package, created by cargo init so it matches the installed toolchain."
needs = ["cargo"]
open = ["src/main.rs", "src/lib.rs"]

[[ask]]
key = "crate_type"
label = "Crate"
choices = ["bin", "lib"]
default = "bin"

[[ask]]
key = "cli"
label = "Command line"
default = false
hint = "clap, with a derive-based argument parser in main.rs"
when = "crate_type == bin"

[[file]]
path = "src/main.rs"
from = "main_clap.rs"
when = ["crate_type == bin", "cli"]

[[run]]
exec = "cargo"
args = ["init", "--{{crate_type}}", "--name", "{{name_snake}}", "--vcs", "none"]

[[task]]
name = "test"
exec = "cargo"
args = ["test"]

[[task]]
name = "clippy"
exec = "cargo"
args = ["clippy", "--all-targets"]

[[run]]
exec = "cargo"
args = ["add", "clap", "--features", "derive"]
when = ["crate_type == bin", "cli"]
