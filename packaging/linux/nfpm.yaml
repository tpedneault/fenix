# Fenix's .deb and .rpm, built by nfpm from a release's Linux files:
#   VERSION=1.0.0 SRC=<the unpacked fenix-<version>-x86_64-unknown-linux-gnu> nfpm package -p deb
# (packaging/linux/build-packages.sh does both.)
name: fenix
arch: amd64
platform: linux
version: ${VERSION}
section: editors
priority: optional
maintainer: Thomas Pedneault <thomas@pedneault.dev>
vendor: Thomas Pedneault
homepage: https://tpedneault.github.io/fenix/
license: MIT OR Apache-2.0
description: |-
  A keyboard-first text editor, written from scratch in Rust.
  Vim's editing grammar, with a SPC leader for everything else: projects,
  Git, a debugger, coding agents over the Agent Client Protocol,
  terminals, and sandboxed WebAssembly extensions from a signed store.

contents:
  - src: ${SRC}/fenix
    dst: /usr/bin/fenix
    file_info:
      mode: 0755
  # The PDF reader extension's companion, found beside fenix.
  - src: ${SRC}/fenix-pdfium
    dst: /usr/bin/fenix-pdfium
    file_info:
      mode: 0755
  - src: packaging/linux/fenix.desktop
    dst: /usr/share/applications/fenix.desktop
  - src: docs/brand/fenix-icon-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/fenix.png
  - src: ${SRC}/README.md
    dst: /usr/share/doc/fenix/README.md
  - src: ${SRC}/CHANGELOG.md
    dst: /usr/share/doc/fenix/CHANGELOG.md
  - src: ${SRC}/LICENSE-MIT
    dst: /usr/share/doc/fenix/LICENSE-MIT
  - src: ${SRC}/LICENSE-APACHE
    dst: /usr/share/doc/fenix/LICENSE-APACHE
  - src: ${SRC}/THIRD-PARTY.md
    dst: /usr/share/doc/fenix/THIRD-PARTY.md

# What the binary links against is the C library and libgcc_s; the windowing and
# GPU libraries are loaded at run time, so they're recommended, not
# required (a headless `fenix --mcp` needs none of them).
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libgcc-s1
    recommends:
      - libvulkan1 | libegl1
      - libxkbcommon0
      - libwayland-client0 | libx11-6
      - git
      - ripgrep
  rpm:
    depends:
      - glibc >= 2.35
      - libgcc
    recommends:
      - vulkan-loader
      - libxkbcommon
      - git
      - ripgrep
