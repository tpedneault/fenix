name: Snap

# Builds the snap (snap/snapcraft.yaml) and keeps it as a download on the
# run, so packaging breakage shows up in the pull request that causes
# it. Nothing is published to the Snap Store from here yet.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the snap
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Tags too: the snap's version says whether this is a release.
          fetch-depth: 0
      - name: Build
        id: build
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
      - name: Upload the snap
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fenix-snap
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
          retention-days: 14
