name: Release

# Pushing a tag vX.Y.Z builds Fenix for Windows and Linux and publishes
# a GitHub release with the binaries -- for Windows a zip and an
# installer (packaging/windows/fenix.iss), for Linux an archive, a .deb
# and an .rpm (packaging/linux), built by build.yml as the nightly's
# are -- and that version's CHANGELOG.md entry. The release stays a draft until every build has uploaded, so
# a failed build never leaves a half-published release behind.
#
# Or run it by hand (Actions, Release, Run workflow, on master) with the
# tag: it releases master's head as it was when the run started, and
# publishing the release makes the tag -- so a run that fails makes none.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag, vX.Y.Z (Cargo.toml says the same)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  draft:
    name: Draft the release
    # By hand, only from master.
    if: github.event_name == 'push' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: The version
        id: version
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: A new tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::not a release tag: $TAG"; exit 1; fi
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG" > /dev/null; then echo "::error::$TAG is already released"; exit 1; fi
      - name: Check the tag matches the version in Cargo.toml
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match the workspace version $version in Cargo.toml"
            exit 1
          fi
      - name: Take this version's notes from CHANGELOG.md
        run: |
          version=${TAG#v}
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            /^\[[^]]+\]: / { if (found) exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no entry for $version"
            exit 1
          fi
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pushed, the tag's there; by hand, publishing makes it, here.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then at=(--target "$GITHUB_SHA"); else at=(--verify-tag); fi
          gh release create "$TAG" --draft "${at[@]}" --title "Fenix ${TAG#v}" --notes-file notes.md

  # The files, built as the nightly's are: build.yml.
  build:
    name: Build
    needs: draft
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.draft.outputs.version }}
      name: fenix-${{ needs.draft.outputs.version }}
      release: ${{ needs.draft.outputs.tag }}

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --draft=false --latest
